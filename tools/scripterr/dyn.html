<html><head></head><body><pre id="out">start</pre>
<script>
var out=document.getElementById('out');
function log(s){ out.textContent += ' ' + s; }
// 1. src set, then appended to body
var a=document.createElement('script'); a.src='/d1.js'; a.onload=function(){log('load-d1');}; document.body.appendChild(a);
// 2. appended to head
var b=document.createElement('script'); b.src='/d2.js'; document.head.appendChild(b);
// 3. inline text, dynamic
var c=document.createElement('script'); c.textContent="log('inline-dyn')"; document.body.appendChild(c);
// 4. appended first, src set after
var d=document.createElement('script'); document.body.appendChild(d); d.src='/d3.js';
// 5. missing -> error only
var e=document.createElement('script'); e.src='/missing3.js'; e.onerror=function(){log('err-missing3');}; e.onload=function(){log('BAD-load-missing3');}; document.body.appendChild(e);
// 6. from a timer
setTimeout(function(){ var f=document.createElement('script'); f.src='/d4.js'; document.body.appendChild(f); }, 0);
// 7. created but never inserted
var g=document.createElement('script'); g.src='/never.js';
log('sync-end');
</script>
<script>log('next-parser-script');</script>
</body></html>

<html><head><style>body{margin:0}span{display:inline-block}</style></head><body>

<div><span id="consolas" style="font:16px Consolas">Hamburgefonstiv</span></div>

<pre id="out"></pre>
<script>
var ids='segoe consolas tahoma lucida calibri sans mono serif'.split(' ');
document.getElementById('out').textContent = ids.map(function(id){
  return id+' '+Math.round(document.getElementById(id).getBoundingClientRect().width);
}).join('\n');
